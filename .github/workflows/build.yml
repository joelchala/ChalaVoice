name: ChalaVoice CI/CD

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z)'
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate icons and store assets
        run: npm run icons
      - name: Build MV3 packages
        run: npm run build
      - name: Run verification suite
        run: npm test

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RAW_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate icons and build release packages
        run: |
          VERSION="${RAW_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          npm run icons
          node tools/make-mv3.mjs "$VERSION"
          node tests/verify.mjs
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        run: |
          gh release create "v${RELEASE_VERSION}" \
            "store/paquetes/ChalaVoice_${RELEASE_VERSION}.chromium.zip" \
            "store/paquetes/ChalaVoice_${RELEASE_VERSION}.edge.zip" \
            "store/paquetes/ChalaVoice_${RELEASE_VERSION}.firefox.zip" \
            --target "$GITHUB_SHA" \
            --title "ChalaVoice v${RELEASE_VERSION}" \
            --generate-notes
